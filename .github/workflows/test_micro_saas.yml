name: Lint & Test Python Micro-SaaS Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/micro_saas_**/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'projects/micro_saas_**/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f projects/micro_saas_inventory/requirements.txt ]; then
            pip install -r projects/micro_saas_inventory/requirements.txt
          fi
          pip install flake8 pytest

      - name: Python Syntax & Quality Check
        run: |
          flake8 projects/ --count --select=E9,F63,F7,F82 --show-source --statistics
